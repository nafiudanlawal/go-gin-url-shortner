spring:
  application:
    name: spring
  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortner
    username: postgres
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: on
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect